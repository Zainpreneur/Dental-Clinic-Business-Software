services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dental_user
      POSTGRES_PASSWORD: dental_pass
      POSTGRES_DB: dental_clinic
    ports:
      - "5432:5432"
    volumes:
      - dental_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental_user -d dental_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://dental_user:dental_pass@db:5432/dental_clinic?schema=public"
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: "change-this-to-a-long-random-secret-in-production"
      JWT_EXPIRES_IN: "8h"
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  dental_db_data:
